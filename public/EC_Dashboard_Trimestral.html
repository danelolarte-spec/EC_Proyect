<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EC Transportes — Dashboard Trimestral</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --navy:#1B2A4A; --navy2:#0F1D35; --gold:#C9A84C; --gold2:#E8C96A;
  --white:#F4F6F9; --gray:#8A96A8; --lgray:#E8ECF2;
  --green:#1A7A4A; --red:#C0392B; --blue:#2471A3; --orange:#D35400; --teal:#117A65; --purple:#8E44AD;
  --bg:#0A111F; --card:#111D30; --card2:#162340;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;}

.dash-header{background:linear-gradient(135deg,var(--navy2) 0%,var(--navy) 100%);border-bottom:2px solid var(--gold);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.dash-header-left{display:flex;align-items:center;gap:16px;}
.dash-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--gold);}
.dash-sub{font-size:11px;color:var(--gray);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
.dash-period{background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--gold);font-weight:600;letter-spacing:1px;text-transform:uppercase;}

.dash-body{padding:28px 32px;max-width:1600px;margin:0 auto;}

.section-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:rgba(201,168,76,0.2);}

.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:28px;}
.kpi-card{background:var(--card);border:1px solid rgba(255,255,255,0.05);border-radius:14px;padding:18px 16px;position:relative;overflow:hidden;transition:transform 0.2s, box-shadow 0.2s;}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.3);}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0;}
.kpi-card.green::before{background:var(--green);}
.kpi-card.red::before{background:var(--red);}
.kpi-card.gold::before{background:var(--gold);}
.kpi-card.blue::before{background:var(--blue);}
.kpi-card.orange::before{background:var(--orange);}
.kpi-card.teal::before{background:var(--teal);}
.kpi-card.purple::before{background:var(--purple);}
.kpi-label{font-size:10px;font-weight:700;color:var(--gray);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.kpi-value{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;line-height:1;margin-bottom:4px;}
.kpi-card.green .kpi-value{color:#4DC88A;}
.kpi-card.red .kpi-value{color:#E05A4E;}
.kpi-card.gold .kpi-value{color:var(--gold);}
.kpi-card.blue .kpi-value{color:#5BA3D9;}
.kpi-card.orange .kpi-value{color:#E8834E;}
.kpi-card.teal .kpi-value{color:#3EBBA0;}
.kpi-card.purple .kpi-value{color:#B07ED1;}
.kpi-sub{font-size:11px;color:var(--gray);}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:28px;}
.full-col{margin-bottom:28px;}

.chart-card{background:var(--card);border:1px solid rgba(255,255,255,0.05);border-radius:14px;padding:20px;}
.chart-card h4{font-size:11px;font-weight:700;color:var(--gray);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;}
.chart-wrap{position:relative;}

.table-card{background:var(--card);border:1px solid rgba(255,255,255,0.05);border-radius:14px;overflow:hidden;}
.table-card h4{font-size:11px;font-weight:700;color:var(--gray);letter-spacing:1.5px;text-transform:uppercase;padding:16px 20px 12px;border-bottom:1px solid rgba(255,255,255,0.05);}
.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table thead th{background:var(--navy2);color:var(--gold);font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:10px 14px;text-align:left;white-space:nowrap;}
.data-table thead th.num{text-align:right;}
.data-table tbody tr{border-bottom:1px solid rgba(255,255,255,0.03);transition:background 0.1s;}
.data-table tbody tr:hover{background:rgba(255,255,255,0.03);}
.data-table tbody td{padding:9px 14px;color:var(--white);font-family:'DM Mono',monospace;font-size:11px;}
.data-table tbody td.num{text-align:right;}
.data-table tbody td:first-child{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--lgray);}
.data-table tbody tr:first-child td{color:var(--gold);font-weight:600;}

.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:700;margin-right:6px;background:rgba(201,168,76,0.15);color:var(--gold);}
.rank-badge.top{background:var(--gold);color:var(--navy);}

.val-green{color:#4DC88A !important;}
.val-red{color:#E05A4E !important;}
.val-blue{color:#5BA3D9 !important;}
.val-gold{color:var(--gold) !important;}

.growth{font-family:'DM Mono',monospace;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;display:inline-block;}
.growth.up{background:rgba(26,122,74,0.2);color:#4DC88A;}
.growth.down{background:rgba(192,57,43,0.2);color:#E05A4E;}
.growth.flat{background:rgba(138,150,168,0.15);color:var(--gray);}

.table-scroll{overflow-x:auto;}
.table-scroll::-webkit-scrollbar{height:4px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.3);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:rgba(201,168,76,0.5);}

.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
.pill-green{background:rgba(26,122,74,0.2);color:#4DC88A;}
.pill-red{background:rgba(192,57,43,0.2);color:#E05A4E;}
.pill-blue{background:rgba(36,113,163,0.2);color:#5BA3D9;}
.pill-orange{background:rgba(211,84,0,0.2);color:#E8834E;}
.pill-gray{background:rgba(138,150,168,0.15);color:var(--gray);}

.empty{padding:60px 20px;text-align:center;color:var(--gray);font-size:14px;}

@media (max-width:1200px){.kpi-grid{grid-template-columns:repeat(3,1fr);}.three-col{grid-template-columns:1fr 1fr;}}
@media (max-width:800px){.kpi-grid{grid-template-columns:repeat(2,1fr);}.two-col,.three-col{grid-template-columns:1fr;}.dash-body{padding:16px;}.dash-header{padding:14px 16px;flex-wrap:wrap;gap:10px;}}
</style>
</head>
<body>

<div class="dash-header">
  <div class="dash-header-left">
    <div>
      <div class="dash-logo">🚌 EC Transportes</div>
      <div class="dash-sub">Dashboard Trimestral · Análisis Cruzado</div>
    </div>
  </div>
  <span class="dash-period" id="periodo">—</span>
</div>

<div class="dash-body" id="dash-body">
  <div class="empty" id="empty-state">Cargando datos...</div>
</div>

<template id="tpl-content">
  <div class="kpi-grid">
    <div class="kpi-card gold">
      <div class="kpi-label">Facturación Total</div>
      <div class="kpi-value" id="kpi-fact">—</div>
      <div class="kpi-sub" id="kpi-fact-sub">—</div>
    </div>
    <div class="kpi-card green">
      <div class="kpi-label">Servicios Liquidados</div>
      <div class="kpi-value" id="kpi-svc">—</div>
      <div class="kpi-sub" id="kpi-svc-sub">—</div>
    </div>
    <div class="kpi-card blue">
      <div class="kpi-label">Ticket Promedio</div>
      <div class="kpi-value" id="kpi-ticket">—</div>
      <div class="kpi-sub">Período completo</div>
    </div>
    <div class="kpi-card purple">
      <div class="kpi-label">Crecimiento MoM</div>
      <div class="kpi-value" id="kpi-growth">—</div>
      <div class="kpi-sub" id="kpi-growth-sub">Último vs anterior</div>
    </div>
    <div class="kpi-card red">
      <div class="kpi-label">Cancelaciones</div>
      <div class="kpi-value" id="kpi-cancel">—</div>
      <div class="kpi-sub" id="kpi-cancel-sub">—</div>
    </div>
    <div class="kpi-card teal">
      <div class="kpi-label">Mejor Mes</div>
      <div class="kpi-value" id="kpi-best">—</div>
      <div class="kpi-sub" id="kpi-best-sub">—</div>
    </div>
  </div>

  <p class="section-title">📊 Comparativa Mensual</p>
  <div class="two-col">
    <div class="table-card">
      <h4>Métricas por Mes</h4>
      <div class="table-scroll">
        <table class="data-table" id="tbl-monthly">
          <thead><tr><th>Mes</th><th class="num">Servicios</th><th class="num">Facturación</th><th class="num">Ticket</th><th class="num">% Cancel</th><th class="num">Δ Fact</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div class="chart-card">
      <h4>Tendencia Mensual</h4>
      <div class="chart-wrap"><canvas id="chart-trend" height="230"></canvas></div>
    </div>
  </div>

  <p class="section-title">🏆 Top 15 Clientes — Comparativa Mes a Mes</p>
  <div class="full-col">
    <div class="table-card">
      <h4>Facturación por Cliente y Mes</h4>
      <div class="table-scroll">
        <table class="data-table" id="tbl-clientes">
          <thead><tr id="tbl-clientes-head"></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <p class="section-title">👨‍✈️ Top 15 Conductores — Comparativa</p>
  <div class="full-col">
    <div class="table-card">
      <h4>Facturación por Conductor y Mes</h4>
      <div class="table-scroll">
        <table class="data-table" id="tbl-conductores">
          <thead><tr id="tbl-conductores-head"></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <p class="section-title">🚗 Top 12 Vehículos &amp; 🏨 Hoteles</p>
  <div class="two-col">
    <div class="table-card">
      <h4>Top Placas</h4>
      <div class="table-scroll">
        <table class="data-table" id="tbl-placas">
          <thead><tr id="tbl-placas-head"></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div class="table-card">
      <h4>Top Hoteles</h4>
      <div class="table-scroll">
        <table class="data-table" id="tbl-hoteles">
          <thead><tr id="tbl-hoteles-head"></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <p class="section-title">📊 Distribución por Categoría — Mes a Mes</p>
  <div class="three-col">
    <div class="chart-card">
      <h4>Tipo de Cliente</h4>
      <div class="chart-wrap"><canvas id="chart-tipo-cliente" height="260"></canvas></div>
    </div>
    <div class="chart-card">
      <h4>Método de Pago</h4>
      <div class="chart-wrap"><canvas id="chart-pago" height="260"></canvas></div>
    </div>
    <div class="chart-card">
      <h4>Tipo de Vehículo</h4>
      <div class="chart-wrap"><canvas id="chart-vehiculo" height="260"></canvas></div>
    </div>
  </div>

  <p class="section-title">📋 Estados &amp; 📦 Productos</p>
  <div class="two-col">
    <div class="chart-card">
      <h4>Servicios por Estado y Mes</h4>
      <div class="chart-wrap"><canvas id="chart-estado" height="240"></canvas></div>
    </div>
    <div class="table-card">
      <h4>Top Productos</h4>
      <div class="table-scroll">
        <table class="data-table" id="tbl-productos">
          <thead><tr id="tbl-productos-head"></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</template>

<script>
const D = window.__EMBEDDED__ || null;

const fmtCOP = v => {
  if (v == null) return '—';
  if (v >= 1e6) return '$' + (v/1e6).toFixed(1) + 'M';
  if (v >= 1e3) return '$' + (v/1e3).toFixed(0) + 'K';
  return '$' + Math.round(v).toLocaleString('es-CO');
};
const fmtFull = v => v == null ? '—' : '$' + Math.round(v).toLocaleString('es-CO');
const fmtPct  = v => v == null ? '—' : (v * 100).toFixed(1) + '%';
const fmtN    = v => v == null ? '—' : v.toLocaleString('es-CO');

const PALETTE = ['#C9A84C','#5BA3D9','#4DC88A','#E8834E','#3EBBA0','#B07ED1','#E05A4E','#F39C12'];
const MONTH_COLORS = ['#5BA3D9','#C9A84C','#4DC88A','#E8834E','#B07ED1','#3EBBA0'];

function growthSpan(pct){
  if(pct == null) return '<span class="growth flat">—</span>';
  const cls = pct > 0.01 ? 'up' : pct < -0.01 ? 'down' : 'flat';
  const arrow = pct > 0.01 ? '▲' : pct < -0.01 ? '▼' : '•';
  return `<span class="growth ${cls}">${arrow} ${(pct*100).toFixed(1)}%</span>`;
}

function init(){
  const body = document.getElementById('dash-body');
  if (!D || !D.meses || D.meses.length === 0) {
    body.innerHTML = '<div class="empty">No hay datos para mostrar.</div>';
    return;
  }
  document.getElementById('empty-state').remove();
  body.appendChild(document.getElementById('tpl-content').content.cloneNode(true));

  document.getElementById('periodo').textContent = D.periodo || '—';

  render();
}

function render(){
  // KPIs
  document.getElementById('kpi-fact').textContent = fmtCOP(D.totals.facturacion);
  document.getElementById('kpi-fact-sub').textContent = D.meses.length + ' meses';
  document.getElementById('kpi-svc').textContent = fmtN(D.totals.servicios);
  document.getElementById('kpi-svc-sub').textContent = 'Liquidados activos';
  document.getElementById('kpi-ticket').textContent = fmtCOP(D.totals.ticket);
  document.getElementById('kpi-growth').textContent = D.totals.growthMoM == null ? '—' : (D.totals.growthMoM*100).toFixed(1) + '%';
  document.getElementById('kpi-growth-sub').textContent = D.totals.growthMoM == null ? '—' : (D.totals.growthMoM >= 0 ? '▲ ' : '▼ ') + 'último vs anterior';
  document.getElementById('kpi-cancel').textContent = fmtN(D.totals.cancelados);
  document.getElementById('kpi-cancel-sub').textContent = fmtPct(D.totals.pctCancel) + ' total';
  document.getElementById('kpi-best').textContent = D.bestMonth.name.split(' ')[0].toUpperCase();
  document.getElementById('kpi-best-sub').textContent = fmtCOP(D.bestMonth.facturacion);

  // Tabla mensual
  const tb = document.querySelector('#tbl-monthly tbody');
  tb.innerHTML = '';
  D.monthly.forEach((m, i) => {
    const prev = i > 0 ? D.monthly[i-1] : null;
    const growth = prev && prev.facturacion ? (m.facturacion - prev.facturacion) / prev.facturacion : null;
    tb.insertAdjacentHTML('beforeend', `<tr>
      <td>${m.mes}</td>
      <td class="num">${fmtN(m.servicios)}</td>
      <td class="num val-gold">${fmtFull(m.facturacion)}</td>
      <td class="num">${fmtCOP(m.ticket)}</td>
      <td class="num ${m.pctCancel > 0.15 ? 'val-red' : 'val-blue'}">${fmtPct(m.pctCancel)}</td>
      <td class="num">${growthSpan(growth)}</td>
    </tr>`);
  });

  // Chart tendencia (servicios bar + facturacion line)
  Chart.defaults.color = '#8A96A8';
  Chart.defaults.font.family = 'DM Sans';

  new Chart(document.getElementById('chart-trend'), {
    type: 'bar',
    data: {
      labels: D.monthly.map(m => m.mes),
      datasets: [
        { type:'bar', label:'Servicios', data: D.monthly.map(m => m.servicios), backgroundColor:'rgba(91,163,217,0.55)', borderRadius:5, yAxisID:'ySvc' },
        { type:'line', label:'Facturación', data: D.monthly.map(m => m.facturacion), borderColor:'#C9A84C', backgroundColor:'rgba(201,168,76,0.1)', tension:0.4, fill:true, pointRadius:5, pointBackgroundColor:'#C9A84C', yAxisID:'yFact' },
      ]
    },
    options:{
      plugins:{ legend:{ labels:{ boxWidth:12, font:{size:11} } },
        tooltip:{ callbacks:{ label: c => c.dataset.label==='Facturación' ? `${c.dataset.label}: ${fmtFull(c.parsed.y)}` : `${c.dataset.label}: ${c.parsed.y}` } } },
      scales:{
        x:{ grid:{display:false} },
        ySvc:{ position:'left', beginAtZero:true, grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'#5BA3D9'}, title:{display:true,text:'Servicios',color:'#5BA3D9',font:{size:10}} },
        yFact:{ position:'right', beginAtZero:true, grid:{display:false}, ticks:{color:'#C9A84C', callback:v=>fmtCOP(v)}, title:{display:true,text:'Facturación',color:'#C9A84C',font:{size:10}} },
      }
    }
  });

  // Tablas top
  renderTopTable('tbl-clientes', 'Cliente', D.topClientes);
  renderTopTable('tbl-conductores', 'Conductor', D.topConductores);
  renderTopTable('tbl-placas', 'Placa', D.topPlacas, true);
  renderTopTable('tbl-hoteles', 'Hotel', D.topHoteles, true);
  renderTopTable('tbl-productos', 'Producto', D.topProductos, true);

  // Stacked bars: tipo cliente / pago / vehiculo / estado
  renderStacked('chart-tipo-cliente', D.byTipoCliente);
  renderStacked('chart-pago', D.byPago);
  renderStacked('chart-vehiculo', D.byVehiculo);
  renderStacked('chart-estado', D.byEstado, true);
}

function renderTopTable(id, label, data, compact){
  const card = document.getElementById(id).closest('.table-card');
  if (!data || !data.length) {
    card.querySelector('h4').insertAdjacentHTML('afterend', '<div class="empty">Sin datos</div>');
    return;
  }
  const head = document.getElementById(id + '-head');
  let cols = `<th>${label}</th>`;
  D.meses.forEach(m => { cols += `<th class="num">${m.split(' ')[0]}</th>`; });
  cols += `<th class="num">Total</th><th class="num">Δ</th>`;
  head.innerHTML = cols;

  const tb = document.querySelector('#' + id + ' tbody');
  tb.innerHTML = '';
  data.forEach((r, i) => {
    let row = `<td><span class="rank-badge ${i===0?'top':''}">${i+1}</span>${r.name}</td>`;
    r.byMonth.forEach(v => { row += `<td class="num">${fmtCOP(v)}</td>`; });
    row += `<td class="num val-gold">${fmtFull(r.total)}</td>`;
    const first = r.byMonth[0] || 0;
    const last = r.byMonth[r.byMonth.length - 1] || 0;
    const g = first ? (last - first) / first : null;
    row += `<td class="num">${growthSpan(g)}</td>`;
    tb.insertAdjacentHTML('beforeend', '<tr>' + row + '</tr>');
  });
}

function renderStacked(canvasId, dataset, asValue){
  if (!dataset || !dataset.categorias || dataset.categorias.length === 0) return;
  new Chart(document.getElementById(canvasId), {
    type: 'bar',
    data: {
      labels: D.meses.map(m => m.split(' ')[0]),
      datasets: dataset.categorias.map((cat, i) => ({
        label: cat,
        data: dataset.matriz[i],
        backgroundColor: PALETTE[i % PALETTE.length],
        borderRadius: 3,
        borderWidth: 0,
      }))
    },
    options:{
      plugins:{ legend:{ position:'bottom', labels:{ font:{size:10}, boxWidth:10, padding:8 } },
        tooltip:{ callbacks:{ label: c => `${c.dataset.label}: ${asValue ? c.parsed.y : fmtCOP(c.parsed.y)}` } } },
      scales:{
        x:{ stacked:true, grid:{display:false} },
        y:{ stacked:true, beginAtZero:true, grid:{color:'rgba(255,255,255,0.04)'}, ticks:{ callback: v => asValue ? v : fmtCOP(v) } },
      }
    }
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
