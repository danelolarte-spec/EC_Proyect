<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EC Proyect — Ingreso</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ec-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
</head>
<body class="login-body">
  <div class="login-orb"></div>
  <div class="login-shell">
    <div class="login-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="16" y1="16" x2="7" y2="9" stroke="#ddc16f" stroke-width="1.6" stroke-linecap="round" />
              <line x1="16" y1="16" x2="25" y2="9" stroke="#ddc16f" stroke-width="1.6" stroke-linecap="round" />
              <line x1="16" y1="16" x2="7" y2="23" stroke="#ddc16f" stroke-width="1.6" stroke-linecap="round" />
              <line x1="16" y1="16" x2="25" y2="23" stroke="#ddc16f" stroke-width="1.6" stroke-linecap="round" />
              <circle cx="7" cy="9" r="2.6" fill="#ddc16f" opacity="0.85" />
              <circle cx="25" cy="9" r="2.6" fill="#ddc16f" opacity="0.85" />
              <circle cx="7" cy="23" r="2.6" fill="#ddc16f" opacity="0.85" />
              <circle cx="25" cy="23" r="2.6" fill="#ddc16f" opacity="0.85" />
              <circle cx="16" cy="16" r="4.2" fill="#ddc16f" />
            </svg>
          </div>
          <div class="brand-text">
            <h1>EC Proyect</h1>
            <p>Plataforma de Gestión</p>
          </div>
        </div>
        <div id="themeToggleHost"></div>
      </div>
      <form id="loginForm">
        <label>Correo electrónico</label>
        <input type="email" id="email" required placeholder="tu@correo.com" autocomplete="username" />
        <label>Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
        <button type="submit" class="btn btn-primary full">Ingresar</button>
        <div id="loginError" class="error-msg"></div>
      </form>
      <div class="login-hint">
        <a href="/solicitud.html" class="external-link">→ Ir al formulario externo de solicitudes</a>
      </div>
    </div>
  </div>
  <script src="/js/theme.js"></script>
  <script>
    document.getElementById('themeToggleHost').appendChild(Theme.widget());
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const err = document.getElementById('loginError');
      err.textContent = '';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        if (!r.ok) {
          const data = await r.json();
          err.textContent = data.error || 'Error de ingreso';
          return;
        }
        window.location.href = '/app.html';
      } catch (e) {
        err.textContent = 'Error de conexión';
      }
    });
  </script>
</body>
</html>
