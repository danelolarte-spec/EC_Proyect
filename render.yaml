services:
  - type: web
    name: ec-proyect
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22.22.2
      - key: DATABASE_PATH
        value: /var/data/data.sqlite
    disk:
      name: ec-proyect-data
      mountPath: /var/data
      sizeGB: 5
